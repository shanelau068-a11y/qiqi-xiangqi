<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#781d18">
  <title>齐齐专用象棋</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">QI QI XIANGQI LAB</p>
        <h1>齐齐专用象棋</h1>
      </div>
      <span class="maker-mark">齐齐专用</span>
    </header>

    <nav class="mode-switch" aria-label="练习模式">
      <button id="puzzle-mode" class="active" type="button">闯关题库</button>
      <button id="ai-mode" type="button">人机对弈</button>
    </nav>

    <div class="quick-tools">
      <button id="sound-toggle" type="button" aria-pressed="true">🔊 声音开</button>
    </div>

    <section id="progress-card" class="progress-card" aria-label="闯关进度">
      <div class="progress-copy">
        <span id="level-label">第 1 / 222 关</span>
        <strong id="score-label">🏅 0</strong>
      </div>
      <div class="progress-track"><div id="progress-bar"></div></div>
    </section>

    <section class="lesson" aria-live="polite">
      <span class="tag" id="level-tag">第一章 · 杀棋训练</span>
      <h2 id="puzzle-title">红方先走，找出妙手</h2>
      <p id="puzzle-text">选择红方棋子，再选择落点。</p>
    </section>

    <section class="board-card">
      <div id="board" class="board-stage" aria-label="中国象棋棋盘">
        <canvas id="board-lines" aria-hidden="true"></canvas>
        <div class="river-brand" aria-hidden="true"><span>楚河</span><b>齐齐专用</b><span>汉界</span></div>
        <div id="piece-layer" class="piece-layer"></div>
      </div>
    </section>

    <p id="message" class="message" aria-live="assertive">轮到红方，请选择棋子。</p>
    <p id="last-move" class="last-move hidden" aria-live="polite"></p>

    <div id="puzzle-actions" class="actions">
      <button id="hint-button" class="secondary" type="button">💡 提示</button>
      <button id="retry-button" class="secondary" type="button">↻ 重来</button>
      <button id="next-button" class="primary" type="button" disabled>下一关 →</button>
    </div>

    <div id="ai-actions" class="actions ai-actions hidden">
      <label for="ai-level">电脑难度</label>
      <select id="ai-level" aria-label="电脑难度">
        <option value="easy">轻松</option>
        <option value="medium" selected>认真</option>
        <option value="hard">挑战</option>
      </select>
      <button id="new-game" class="primary" type="button">新对局</button>
    </div>

    <section class="knowledge-card">
      <h3>齐齐小课堂</h3>
      <p id="tip-text">先观察对方将的逃路，再找车、炮、马的连续进攻。</p>
    </section>

    <footer>
      <strong>齐齐专用</strong>
      <button id="reset-progress" type="button">清空闯关记录</button>
    </footer>
  </main>
  <script src="puzzles-1.js"></script>
  <script src="puzzles-2.js"></script>
  <script src="puzzles-3.js"></script>
  <script src="puzzles-4.js"></script>
  <script src="puzzles-5.js"></script>
  <script src="puzzles-6.js"></script>
  <script src="puzzles-7.js"></script>
  <script src="puzzles-8.js"></script>
  <script src="puzzles-9.js"></script>
  <script src="puzzles-10.js"></script>
  <script src="puzzles-11.js"></script>
  <script src="puzzles-12.js"></script>
  <script src="puzzles-13.js"></script>
  <script src="puzzles-14.js"></script>
  <script src="puzzles-15.js"></script>
  <script src="rules.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>

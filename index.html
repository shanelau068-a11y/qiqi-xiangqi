<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#781d18">
  <title>齐齐专用象棋闯关</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">QI QI XIANGQI LAB</p>
        <h1>齐齐专用象棋闯关</h1>
      </div>
      <span class="maker-mark">齐齐制作</span>
    </header>

    <section class="progress-card" aria-label="闯关进度">
      <div class="progress-copy">
        <span id="level-label">第 1 / 77 关</span>
        <strong id="score-label">🏅 0</strong>
      </div>
      <div class="progress-track"><div id="progress-bar"></div></div>
    </section>

    <section class="lesson" aria-live="polite">
      <span class="tag" id="level-tag">第一章 · 一步杀</span>
      <h2 id="puzzle-title">红方先走，一步将杀</h2>
      <p id="puzzle-text">选择红方棋子，再选择落点。</p>
    </section>

    <section class="board-card">
      <div id="board" class="board-stage" aria-label="中国象棋棋盘">
        <canvas id="board-lines" aria-hidden="true"></canvas>
        <div class="river-brand" aria-hidden="true"><span>楚河</span><b>齐齐专用</b><span>汉界</span></div>
        <div id="piece-layer" class="piece-layer"></div>
      </div>
    </section>

    <p id="message" class="message" aria-live="assertive">轮到红方，请选择棋子。</p>

    <div class="actions">
      <button id="hint-button" class="secondary" type="button">💡 提示</button>
      <button id="retry-button" class="secondary" type="button">↻ 重来</button>
      <button id="next-button" class="primary" type="button" disabled>下一关 →</button>
    </div>

    <section class="knowledge-card">
      <h3>齐齐小课堂</h3>
      <p id="tip-text">一步杀：这一手落下后，对方的将无处可逃。</p>
    </section>

    <footer>
      <strong>齐齐专用 · 齐齐制作</strong>
      <button id="reset-progress" type="button">清空闯关记录</button>
    </footer>
  </main>
  <script src="puzzles-1.js"></script>
  <script src="puzzles-2.js"></script>
  <script src="puzzles-3.js"></script>
  <script src="puzzles-4.js"></script>
  <script src="puzzles-5.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
